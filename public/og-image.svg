<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#0B1220" />
      <stop offset="60%" stop-color="#05070B" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>
    <radialGradient id="ambientBlue" cx="20%" cy="40%" r="40%">
      <stop offset="0%" stop-color="rgba(59, 130, 246, 0.22)" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
    <radialGradient id="ambientOrange" cx="80%" cy="60%" r="45%">
      <stop offset="0%" stop-color="rgba(249, 115, 22, 0.18)" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="45%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#ambientBlue)" />
  <rect width="1200" height="630" fill="url(#ambientOrange)" />

  <!-- Subtle Border Grid Line -->
  <rect x="24" y="24" width="1152" height="582" rx="20" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />

  <!-- Brand Symbol Logo Box -->
  <g transform="translate(80, 80)">
    <rect width="72" height="72" rx="18" fill="url(#boxGrad)" />
    <rect x="2" y="2" width="68" height="68" rx="16" fill="#05070B" />
    <text x="36" y="47" font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="900" font-size="28" fill="#60A5FA" text-anchor="middle">KV</text>
  </g>

  <!-- Status Monospace Pill -->
  <g transform="translate(175, 96)">
    <rect width="360" height="40" rx="20" fill="rgba(8, 13, 22, 0.85)" stroke="rgba(71, 85, 105, 0.6)" stroke-width="1" />
    <circle cx="22" cy="20" r="5" fill="#FB923C" />
    <text x="36" y="25" font-family="'JetBrains Mono', monospace" font-size="14" fill="#E2E8F0">B.Tech CSE (Data Science) • 2026 Developer</text>
  </g>

  <!-- Name Title -->
  <text x="80" y="270" font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="900" font-size="78" fill="#FFFFFF" letter-spacing="-1">
    Hi, I'm <tspan fill="url(#textGrad)">Kartik Verma</tspan>.
  </text>

  <!-- Role Subtitle -->
  <text x="80" y="340" font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="700" font-size="34" fill="#94A3B8" letter-spacing="3">
    AI • DATA SCIENCE • FULL-STACK DEVELOPER
  </text>

  <!-- Narrative Summary -->
  <text x="80" y="410" font-family="'Inter', -apple-system, sans-serif" font-weight="400" font-size="22" fill="#CBD5E1">
    Building intelligent systems, satellite telemetry pipelines, and interactive developer experiences.
  </text>

  <!-- Flagship Projects Bar -->
  <g transform="translate(80, 485)">
    <!-- Pyravex -->
    <g transform="translate(0, 0)">
      <rect width="180" height="48" rx="12" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(249, 115, 22, 0.5)" stroke-width="1.2" />
      <text x="90" y="30" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="14" fill="#FB923C" text-anchor="middle">PYRAVEX</text>
    </g>

    <!-- Veridexa -->
    <g transform="translate(195, 0)">
      <rect width="180" height="48" rx="12" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(139, 92, 246, 0.5)" stroke-width="1.2" />
      <text x="90" y="30" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="14" fill="#A78BFA" text-anchor="middle">VERIDEXA</text>
    </g>

    <!-- ChronoSat -->
    <g transform="translate(390, 0)">
      <rect width="180" height="48" rx="12" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(56, 189, 248, 0.5)" stroke-width="1.2" />
      <text x="90" y="30" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="14" fill="#38BDF8" text-anchor="middle">CHRONOSAT</text>
    </g>

    <!-- NudgeKavach -->
    <g transform="translate(585, 0)">
      <rect width="180" height="48" rx="12" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(34, 197, 94, 0.5)" stroke-width="1.2" />
      <text x="90" y="30" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="14" fill="#4ADE80" text-anchor="middle">NUDGEKAVACH</text>
    </g>

    <!-- HostelHub -->
    <g transform="translate(780, 0)">
      <rect width="180" height="48" rx="12" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(244, 63, 94, 0.5)" stroke-width="1.2" />
      <text x="90" y="30" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="14" fill="#FB7185" text-anchor="middle">HOSTELHUB</text>
    </g>
  </g>

  <!-- Bottom Coordinates Tag -->
  <text x="1120" y="580" font-family="'JetBrains Mono', monospace" font-size="13" fill="#64748B" text-anchor="end">
    PSIT KANPUR // KARTIK.OS v1.0 // 2026
  </text>
</svg>
